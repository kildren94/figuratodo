name: Publicar sitio

# Publica la página cuando cambia el código del sitio (docs/), con los últimos datos de la rama "datos".
# La lectura de precios publica por su cuenta al terminar.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: datos
          path: _datos

      - name: Poner los datos en el sitio
        run: |
          rm -rf docs/data
          cp -r _datos/data docs/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
