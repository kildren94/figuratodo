name: Actualizar precios

on:
  schedule:
    # 06:17 y 18:17 hora de Chile (UTC-3)
    - cron: "17 9,21 * * *"
  workflow_dispatch:
    inputs:
      stores:
        description: "ids de tiendas separados por coma (vacío = todas)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pruebas
        run: pip install pytest && python -m pytest -q

      - name: Leer tiendas
        run: |
          if [ -n "${{ github.event.inputs.stores }}" ]; then
            python -m scraper.main --stores "${{ github.event.inputs.stores }}"
          else
            python -m scraper.main
          fi

      - name: Guardar datos
        run: |
          git config user.name "figuratodo-bot"
          git config user.email "figuratodo-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Precios $(TZ=America/Santiago date '+%Y-%m-%d %H:%M')"
            git push
          fi
