name: Actualizar precios

on:
  schedule:
    # 3 lecturas al día: 05:17, 13:17 y 21:17 hora de Chile (UTC-3).
    # GitHub suele lanzarlas con algunas horas de atraso; si se juntan dos, la segunda espera a la primera.
    - cron: "17 0,8,16 * * *"
  push:
    branches: [main]
    paths: ["ajustes.json"]
  workflow_dispatch:
    inputs:
      stores:
        description: "ids de tiendas separados por coma (vacío = todas)"
        required: false
        default: ""

permissions:
  contents: write   # guardar la rama datos
  pages: write      # publicar el sitio
  id-token: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # los datos viven en la rama "datos" (un solo commit que se reemplaza), no en main
      - uses: actions/checkout@v4
        with:
          ref: datos
          path: _datos

      - name: Traer datos de la lectura anterior
        run: |
          rm -rf docs/data cache
          cp -r _datos/data docs/data
          cp -r _datos/cache cache

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pruebas
        run: pip install pytest && python -m pytest -q

      - name: Leer tiendas
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m scraper.main --rebuild
          elif [ -n "${{ github.event.inputs.stores }}" ]; then
            python -m scraper.main --stores "${{ github.event.inputs.stores }}"
          else
            python -m scraper.main
          fi

      - name: Guardar datos (reemplaza la rama datos por un solo commit)
        working-directory: _datos
        run: |
          rm -rf data cache
          cp -r ../docs/data data
          cp -r ../cache cache
          git config user.name "figuratodo-bot"
          git config user.email "figuratodo-bot@users.noreply.github.com"
          git checkout -q --orphan nuevo
          git add -A
          git commit -qm "Datos $(TZ=America/Santiago date '+%Y-%m-%d %H:%M')"
          git push -f origin nuevo:datos

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: scrape
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
